name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build only needs these to exist; nothing is contacted at build
          # time, and the real values live in the Vercel project.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # Keeping the generated bundle in the repo is only safe if it is checked.
      # A migration added without re-running db:bundle would otherwise ship a
      # setup.sql that silently lacks it.
      - name: setup.sql is in sync with the migrations
        run: |
          npm run db:bundle
          git diff --exit-code supabase/setup.sql \
            || (echo "::error::supabase/setup.sql is stale — run 'npm run db:bundle' and commit the result." && exit 1)

  rls:
    name: Row Level Security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # The privacy rules live entirely in the policies, where no amount of
      # testing the UI can reach them. They are checked here against a real
      # PostgreSQL with the whole schema applied, as three different people.
      - name: Apply the schema
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/tests/shim.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/setup.sql

      - name: My List privacy rules
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/tests/shared-notes.sql

      - name: Deleting and restoring tasks
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/tests/trash-tasks.sql

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Playwright
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
